name: Sinotau
description: >-
  Sinotau (先通医药) is a Chinese pharmaceutical innovator specializing in the research,
  development, production, clinical application, and academic promotion of radiopharmaceuticals
  (nuclear medicine). Formally established in 2014, the company focuses on three therapeutic
  areas — oncology, neurology, and cardiology — and has brought its first innovative product,
  欧韦宁 (Florbetaben Fluorine-18 injection for PET brain imaging), to market alongside a
  pipeline of 10+ products in development. Sinotau operates multiple R&D and production
  facilities, employs 400+ staff, and holds 80+ authorized patents. It was surfaced as a
  portfolio company of Qiming Venture Partners. As a corporate radiopharmaceutical
  manufacturer, Sinotau publishes a corporate marketing website but no public developer
  platform, API, or technical documentation surface at this time.
